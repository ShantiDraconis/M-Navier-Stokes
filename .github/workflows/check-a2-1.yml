name: check-a2-1

on:
  push:
    branches:
      - a2.1-weightedIBP
    paths:
      - 'A2/TestA2-1.lean'
      - 'A2/Common.lean'
      - 'Core/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/check-a2-1.yml'
  pull_request:
    paths:
      - 'A2/TestA2-1.lean'
      - 'A2/Common.lean'
      - 'Core/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/check-a2-1.yml'
  workflow_dispatch:

jobs:
  check-a2-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: '.'
          build: false
      - name: Compile A2.1 only
        run: lake env lean A2/TestA2-1.lean
