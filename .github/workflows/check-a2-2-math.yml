name: check-a2-2-math

on:
  push:
    branches: [next/a2-2-math, next/a2-2-budget, next/a2-2-signed-cz]
    paths: ['A2/**','Core/**','audit/**','scripts/**','.github/workflows/check-a2-2-math.yml','lakefile.lean','lean-toolchain']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update and cache
        run: |
          lake update
          lake exe cache get
      - name: Build G1
        run: lake build G1
      - name: Compile K4 scaling audit
        run: lake env lean Core/G1/K4ScalingAudit.lean
      - name: Regression A2.1
        run: lake env lean A2/TestA2-1.lean
      - name: Compile A2.2 historical barrier successor
        run: lake env lean A2/TestA2-2.lean
      - name: Interface firewall
        run: |
          grep -q 'def signedFarFieldIntegral' Core/G1/SignedFarField.lean
          grep -q '∫ y, farRegionIntegrand' Core/G1/SignedFarField.lean
          if grep -R -n 'signedFarField ' Core A2 --include='*.lean'; then
            echo 'Legacy pointwise signedFarField remains in active chain.'
            exit 1
          fi
          if grep -n -E '^[[:space:]]*Jr[[:space:]]*:' A2/TestA2-2.lean; then
            echo 'Detached scalar Jr remains in A2.2.'
            exit 1
          fi
          grep -q 'profile.J scaling.r' A2/TestA2-2.lean
      - name: Historical barrier specification firewall
        run: |
          grep -q 'def BarrierPreservation' Core/G1/DynamicCampanato.lean
          grep -q '2 \* gamma \* C + 2 \* A ≤ C' Core/G1/DynamicCampanato.lean
          if grep -R -n 'def SubcriticalBudget' Core A2 --include='*.lean'; then
            echo 'Obsolete provisional SubcriticalBudget remains active.'
            exit 1
          fi
          RAW="$(sed -n '/structure CampanatoFromWeightedInputs where/,/def CampanatoOneStep/p' A2/TestA2-2.lean)"
          if printf '%s\n' "$RAW" | grep -E 'BarrierPreservation|gamma_lt_half|2[[:space:]]*\*[[:space:]]*.*gamma.*C'; then
            echo 'Barrier/contraction target laundered into raw A2.2 input.'
            exit 1
          fi
      - name: K4 scaling and directional-contract firewall
        run: |
          grep -q 'def requiredRhoExponent' Core/G1/K4ScalingAudit.lean
          grep -q '2 \* sK + 2 \* sD - 3' Core/G1/K4ScalingAudit.lean
          grep -q 'theorem master_scaling_determinant' Core/G1/K4ScalingAudit.lean
          grep -q 'theorem p3_forces_directional_degree_zero' Core/G1/K4ScalingAudit.lean
          grep -q 'D.contract (xi x) (xi y)' Core/G1/SignedFarField.lean
          grep -q 'theorem signedFarIntegrand_magnitude_degree_one' Core/G1/SignedFarField.lean
          grep -q 'homogeneous_degree_three' Core/G1/SignedFarField.lean
          grep -q 'gradient_decay : ∀' Core/G1/SignedFarField.lean
          grep -q 'structure KernelCancellationSpec' Core/G1/SignedFarField.lean
          grep -q 'mean_zero : ∫ theta, angularKernel theta = 0' Core/G1/SignedFarField.lean
          if grep -q 'D.contract (xi x) (omega y)' Core/G1/SignedFarField.lean; then
            echo 'Raw vorticity is still double-counted inside the directional contraction.'
            exit 1
          fi
          if grep -q 'gradient_decay : Prop\|annular_mean_zero : Prop' Core/G1/SignedFarField.lean; then
            echo 'Opaque kernel analytic marker detected.'
            exit 1
          fi
          if grep -q 'sK + 2 \* sD - 3' Core/G1/K4ScalingAudit.lean; then
            echo 'Incorrect non-quadratic FarAvg exponent formula detected.'
            exit 1
          fi
      - name: No proof-gap constructs
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|^[[:space:]]*axiom[[:space:]]' Core A2 --include='*.lean'; then
            echo 'Forbidden proof-gap construct.'
            exit 1
          fi
      - name: Static laundering tripwire
        run: python3 scripts/check_assumption_laundering.py
      - name: Scientific boundary check
        run: |
          grep -q 'def CampanatoOneStep' A2/TestA2-2.lean
          grep -q 'def BarrierPreservation' Core/G1/DynamicCampanato.lean
          grep -q 'theorem coefficient_half_of_barrier' Core/G1/DynamicCampanato.lean
          grep -q 'theorem gamma_lt_half_of_barrier' Core/G1/DynamicCampanato.lean
          grep -q 'theorem contraction_from_barrier_preservation' A2/TestA2-2.lean
          echo "CERT_SHA=$GITHUB_SHA"
          echo 'MECHANICAL_STATUS=TESTING'
          echo 'SCIENTIFIC_STATUS=OPEN_BRIDGE'
          echo 'NODE_K4_SCALING=PROVED_LEAN_CANDIDATE'
          echo 'NODE_K4_DIRECTIONAL_MODEL=PROVED_LEAN_CANDIDATE'
          echo 'NODE_K4_KERNEL_ANALYTIC_CONTRACTS=TYPED_OPEN_BRIDGE'
          echo 'NODE_K4_SIGNED_CANCELLATION=OPEN_BRIDGE'
          echo 'NODE_K4_LINEAR_GAIN=OPEN_BRIDGE'
          echo 'NODE_CAMPANATO_ONE_STEP=OPEN_BRIDGE'
          echo 'NODE_BARRIER_PRESERVATION=OPEN_BRIDGE'
          echo 'NODE_DYADIC_BARRIER_ALGEBRA=PROVED_LEAN_CANDIDATE'
