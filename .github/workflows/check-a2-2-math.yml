name: check-a2-2-math

on:
  push:
    branches: [next/a2-2-math]
    paths: ['A2/**','Core/**','.github/workflows/check-a2-2-math.yml','lakefile.lean','lean-toolchain']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update and cache
        run: |
          lake update
          lake exe cache get
      - name: Build G1
        run: lake build G1
      - name: Regression A2.1
        run: lake env lean A2/TestA2-1.lean
      - name: Compile laundering-free A2.2
        run: lake env lean A2/TestA2-2.lean
      - name: Target-as-input firewall
        run: |
          if grep -n -E 'hgamma_half[[:space:]]*:|gamma_lt_half[[:space:]]*:' A2/TestA2-2.lean; then
            echo 'Target property found as an input field.'
            exit 1
          fi
          if grep -R -n -E '\bsorry\b|\badmit\b|^[[:space:]]*axiom[[:space:]]' Core A2 --include='*.lean'; then
            echo 'Forbidden proof-gap construct.'
            exit 1
          fi
      - name: Boundary check
        run: |
          grep -q 'def CampanatoOneStep' A2/TestA2-2.lean
          grep -q 'structure A2DerivedContraction' A2/TestA2-2.lean
          echo "CERT_SHA=$GITHUB_SHA"
          echo 'SCIENTIFIC_STATUS=OPEN_BRIDGE'
