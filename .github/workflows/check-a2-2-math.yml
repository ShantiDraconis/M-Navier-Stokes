name: check-a2-2-math

on:
  push:
    branches: [next/a2-2-math, next/a2-2-budget, next/a2-2-signed-cz, advance/k4-signed-cz]
    paths: ['A2/**','Core/**','audit/**','evidence/**','scripts/**','.github/workflows/check-a2-2-math.yml','lakefile.lean','lean-toolchain']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update and cache
        run: |
          lake update
          lake exe cache get
      - name: Build G1
        run: lake build G1
      - name: Compile K4 scaling audit
        run: lake env lean Core/G1/K4ScalingAudit.lean
      - name: Typecheck K4 signed-CZ definitions
        run: lake env lean Core/G1/K4SignedCZDefs.lean
      - name: Check K4 refutation frontier
        run: lake env lean Core/G1/K4SignedCZRefutation.lean
      - name: Regression A2.1
        run: lake env lean A2/TestA2-1.lean
      - name: Compile A2.2 historical barrier successor
        run: lake env lean A2/TestA2-2.lean
      - name: Interface firewall
        run: |
          grep -q 'def signedFarFieldIntegral' Core/G1/SignedFarField.lean
          grep -q '∫ y, farRegionIntegrand' Core/G1/SignedFarField.lean
          if grep -R -n 'signedFarField ' Core A2 --include='*.lean'; then exit 1; fi
          if grep -n -E '^[[:space:]]*Jr[[:space:]]*:' A2/TestA2-2.lean; then exit 1; fi
          grep -q 'profile.J scaling.r' A2/TestA2-2.lean
      - name: Historical barrier specification firewall
        run: |
          grep -q 'def BarrierPreservation' Core/G1/DynamicCampanato.lean
          grep -q '2 \* gamma \* C + 2 \* A ≤ C' Core/G1/DynamicCampanato.lean
          if grep -R -n 'def SubcriticalBudget' Core A2 --include='*.lean'; then exit 1; fi
          RAW="$(sed -n '/structure CampanatoFromWeightedInputs where/,/def CampanatoOneStep/p' A2/TestA2-2.lean)"
          if printf '%s\n' "$RAW" | grep -E 'BarrierPreservation|gamma_lt_half|2[[:space:]]*\*[[:space:]]*.*gamma.*C'; then exit 1; fi
      - name: K4 two-fingerprint firewall
        run: |
          grep -q 'def K4ScalingDegrees.requiredRhoExponent' Core/G1/K4ScalingAudit.lean
          grep -q '2 \* q.sK + 2 \* q.sD - 3' Core/G1/K4ScalingAudit.lean
          grep -q 'theorem master_scaling_determinant' Core/G1/K4ScalingAudit.lean
          grep -q 'theorem p3_forces_directional_degree_zero' Core/G1/K4ScalingAudit.lean
          grep -q 'structure DirectionScalingWitness' Core/G1/K4ScalingAudit.lean
          grep -q 'theorem contract_degree_zero_of_direction_invariant' Core/G1/K4ScalingAudit.lean
          grep -q 'D.contract (xi x) (xi y)' Core/G1/SignedFarField.lean
          grep -q 'theorem signedFarIntegrand_magnitude_degree_one' Core/G1/SignedFarField.lean
          grep -q 'homogeneous_degree_three' Core/G1/SignedFarField.lean
          grep -q 'grad_is_derivative' Core/G1/SignedFarField.lean
          grep -q 'annular_mean_zero' Core/G1/SignedFarField.lean
          grep -q 'ballVolume r center' Core/G1/SignedFarField.lean
          grep -q 'def directionalOscillation' Core/G1/SignedFarField.lean
          grep -q 'structure DyadicFarEstimate (shellContribution' Core/G1/SignedFarField.lean
          grep -q 'theorem directionalOscillation_constant_zero' Core/G1/K4SignedCZRefutation.lean
          if grep -q 'D.contract (xi x) (omega y)' Core/G1/SignedFarField.lean; then exit 1; fi
          if grep -E -q '^[[:space:]]*(def|structure|class|abbrev)[[:space:]]+(angularKernel|PositiveBallVolume)([[:space:]:({]|$)' Core/G1/SignedFarField.lean; then exit 1; fi
          if grep -E -q '^[[:space:]]*(oscillation[[:space:]]*:[[:space:]]*Point3|shellBound[[:space:]]*:)' Core/G1/SignedFarField.lean; then exit 1; fi
          if grep -E -q '^[[:space:]]*(q\.)?sK[[:space:]]*\+[[:space:]]*2[[:space:]]*\*[[:space:]]*(q\.)?sD[[:space:]]*-[[:space:]]*3[[:space:]]*$' Core/G1/K4ScalingAudit.lean; then exit 1; fi
          if grep -q 'D.contract xi (lambda • omega)' Core/G1/K4ScalingAudit.lean; then exit 1; fi
      - name: No proof-gap constructs
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|^[[:space:]]*axiom[[:space:]]' Core A2 --include='*.lean'; then exit 1; fi
      - name: Static laundering tripwire
        run: python3 scripts/check_assumption_laundering.py
      - name: Scientific boundary check
        run: |
          grep -q 'def AngularBlindCounterexampleWitness' Core/G1/K4SignedCZRefutation.lean
          grep -q 'def SignedCZLinearGainTarget' Core/G1/SignedFarField.lean
          echo "CERT_SHA=$GITHUB_SHA"
          echo 'MECHANICAL_STATUS=TESTING'
          echo 'SCIENTIFIC_STATUS=OPEN_MATH'
          echo 'K4_NEW_MACRO_GATES=0'
          echo 'K4_BRANCH_DECISION=PENDING_WITNESS_OR_EXCLUSION'
          echo 'NODE_K4_SIGNED_CANCELLATION=OPEN_BRIDGE'
          echo 'NODE_K4_LINEAR_GAIN=OPEN_BRIDGE'
