name: audit-8x5-ns

on:
  push:
    branches: [audit/multistate-proof-refutation-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify-8x5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit writer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen S1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c56d9632facf96e0a5d834b987b30df5fe2563a1
          path: _frozen_s1
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout add-only locked S1 successor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0
          path: _s1_locked
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build: false
          test: false
          lint: false

      - name: L1 HEAD_EXATO
        run: |
          set -euo pipefail
          test ${#GITHUB_SHA} -eq 40
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "AUDIT_HEAD=$GITHUB_SHA"
          echo "FROZEN_SOURCE_HEAD=c56d9632facf96e0a5d834b987b30df5fe2563a1"
          echo "LOCK_SUCCESSOR_HEAD=cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"

      - name: L2 FROZEN_S1
        run: |
          set -euo pipefail
          test "$(git -C _frozen_s1 rev-parse HEAD)" = "c56d9632facf96e0a5d834b987b30df5fe2563a1"
          grep -q 'theorem I_core_closed' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L3 ENDPOINT_DEFINITION
        run: |
          set -euo pipefail
          grep -q 'def FinalTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean
          grep -q 'def ClosedClosedClosedTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L4 COMPRESSION
        run: |
          set -euo pipefail
          grep -q 'theorem final_of_middle_closed' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean
          grep -q 'def MiddleClosureTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L5 8x5 semantic audit compiles from committed lock
        run: |
          set -euo pipefail
          test -f lake-manifest.json
          echo "6b7329f16d157be7350dd1fedb61011620be3210fa03d5498380d59e6b109876  lake-manifest.json" | sha256sum -c -
          jq -e '
            [.packages[] |
              select(.name == "mathlib") |
              select(.inputRev == "v4.32.1") |
              select(.rev == "520045ab14e26149ee970e2e617ca04b09bde5d6")
            ] | length == 1
          ' lake-manifest.json
          lake exe cache get || true
          lake build Audit8x5
          lake env lean audit/Audit8x5.lean
          grep -q '"HC": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"Q": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"S": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"K": 0' audit/8x5/NS_8x5_STATE.json
          echo "AUDIT_WRITER_LOCK=VERIFIED"

      - name: L6 RESIDUE_CLASSIFIER
        run: |
          set -euo pipefail
          grep -q 'HC: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          grep -q 'Q: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          grep -q 'K: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          echo 'RESIDUE_CLASSIFIER=GREEN'

      - name: L7a frozen dependency provenance diagnosis
        id: l7a
        working-directory: _frozen_s1
        run: |
          set -euo pipefail
          {
            echo "FROZEN_SHA=$(git rev-parse HEAD)"
            echo "--- lean-toolchain ---"
            cat lean-toolchain
            echo "--- lakefile.lean ---"
            cat lakefile.lean
            echo "--- lock presence ---"
            test ! -f lakefile.toml || { echo "UNEXPECTED lakefile.toml"; cat lakefile.toml; }
            if test -f lake-manifest.json; then
              echo "LAKE_MANIFEST_PRESENT=YES"
              sha256sum lake-manifest.json
            else
              echo "LAKE_MANIFEST_PRESENT=NO"
              echo "HERMETICITY_STATUS=MISSING_COMMITTED_LOCK"
            fi
            echo "--- historical provenance ---"
            echo "HISTORICAL_RED_RUN=35329861796"
            echo "HISTORICAL_RED_STATUS=FAILURE_NO_ARTIFACTS"
            echo "NETWORK_RESOLVED_SUCCESS_RUN=35332836485"
            echo "NETWORK_RESOLVED_SUCCESS_CLASS=NON_HERMETIC_LAKE_UPDATE"
            echo "LOCK_SUCCESSOR_SHA=cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"
            echo "LOCK_MANIFEST_SHA256=6b7329f16d157be7350dd1fedb61011620be3210fa03d5498380d59e6b109876"
          } 2>&1 | tee L7a.log

      - name: Upload L7a diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7a-frozen-provenance-${{ github.run_id }}
          path: _frozen_s1/L7a.log

      - name: L7a successor provenance and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _frozen_s1 rev-parse HEAD)" = "c56d9632facf96e0a5d834b987b30df5fe2563a1"
          test "$(git -C _s1_locked rev-parse HEAD)" = "cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"
          test "$(git show -s --format=%P cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0)" = "c56d9632facf96e0a5d834b987b30df5fe2563a1"
          EXPECTED="$(printf 'A\tlake-manifest.json')"
          ACTUAL="$(git diff --name-status --no-renames c56d9632facf96e0a5d834b987b30df5fe2563a1..cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0)"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --diff-filter=D --name-only c56d9632facf96e0a5d834b987b30df5fe2563a1..cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0)"
          for p in Core Vendor scripts lakefile.lean lean-toolchain; do
            test "$(git rev-parse c56d9632facf96e0a5d834b987b30df5fe2563a1:$p)" = "$(git rev-parse cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0:$p)"
          done
          test -f _s1_locked/lake-manifest.json
          echo "6b7329f16d157be7350dd1fedb61011620be3210fa03d5498380d59e6b109876  _s1_locked/lake-manifest.json" | sha256sum -c -
          jq -e '
            [.packages[] |
              select(.name == "mathlib") |
              select(.inputRev == "v4.32.1") |
              select(.rev == "520045ab14e26149ee970e2e617ca04b09bde5d6")
            ] | length == 1
          ' _s1_locked/lake-manifest.json
          echo "S1_SUCCESSOR_IDENTITY=GREEN"

      - name: L7b setup diagnostics
        run: mkdir -p /tmp/L7b-diag

      - name: L7b capture toolchain and lock
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          lake --version | tee /tmp/L7b-diag/lake-version.txt
          lean --version | tee /tmp/L7b-diag/lean-version.txt
          sha256sum lake-manifest.json | tee /tmp/L7b-diag/manifest-hash.txt
          cp lake-manifest.json /tmp/L7b-diag/manifest.json
          git rev-parse HEAD | tee /tmp/L7b-diag/S1_SUCCESSOR_SHA.txt
          git rev-parse HEAD^ | tee /tmp/L7b-diag/S1_PARENT_SHA.txt
          git rev-parse HEAD^{tree} | tee /tmp/L7b-diag/S1_SUCCESSOR_TREE.txt
          git rev-parse HEAD^^{tree} | tee /tmp/L7b-diag/S1_PARENT_TREE.txt

      - name: L7b cache get isolated
        id: l7b_cache
        working-directory: _s1_locked
        shell: bash
        run: |
          set +e
          set -o pipefail
          lake exe cache get 2>&1 | tee /tmp/L7b-diag/cache-get.log
          rc=${PIPESTATUS[0]}
          echo "$rc" | tee /tmp/L7b-diag/cache-get.exit
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: L7b build IMath isolated
        id: l7b_imath
        working-directory: _s1_locked
        shell: bash
        run: |
          set +e
          set -o pipefail
          lake build IMath 2>&1 | tee /tmp/L7b-diag/lake-build-IMath.log
          rc=${PIPESTATUS[0]}
          echo "$rc" | tee /tmp/L7b-diag/lake-build-IMath.exit
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload L7b diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7b-diagnostics-${{ github.run_id }}
          path: /tmp/L7b-diag/
          if-no-files-found: error

      - name: L7b fail-closed verdict
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.l7b_imath.outputs.exit_code }}" = "0"
          echo "L7B_IMATH=GREEN"
          echo "L7B_CACHE_EXIT=${{ steps.l7b_cache.outputs.exit_code }}"

      - name: L7c locked-successor G1 library
        id: l7c
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          lake build G1 2>&1 | tee L7c.log

      - name: Upload L7c log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7c-g1-${{ github.run_id }}
          path: _s1_locked/L7c.log
          if-no-files-found: error

      - name: L7d MaximalFrontier
        id: l7d
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          lake env lean Core/G1/MaximalFrontier.lean 2>&1 | tee L7d.log

      - name: Upload L7d log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7d-maximal-frontier-${{ github.run_id }}
          path: _s1_locked/L7d.log
          if-no-files-found: error

      - name: L7e ClosedClosedClosedTarget
        id: l7e
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          lake env lean Core/G1/ClosedClosedClosedTarget.lean 2>&1 | tee L7e.log

      - name: Upload L7e log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7e-closed-target-${{ github.run_id }}
          path: _s1_locked/L7e.log
          if-no-files-found: error

      - name: L7f locked-successor snapshot integrity
        id: l7f
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"
          {
            echo "FROZEN=c56d9632facf96e0a5d834b987b30df5fe2563a1"
            echo "SUCCESSOR=cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"
            git diff --name-status --no-renames c56d9632facf96e0a5d834b987b30df5fe2563a1..cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0
            for p in Core Vendor scripts lakefile.lean lean-toolchain; do
              echo "$p frozen=$(git rev-parse c56d9632facf96e0a5d834b987b30df5fe2563a1:$p) successor=$(git rev-parse cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0:$p)"
              test "$(git rev-parse c56d9632facf96e0a5d834b987b30df5fe2563a1:$p)" = "$(git rev-parse cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0:$p)"
            done
          } 2>&1 | tee L7f.log

      - name: Upload L7f log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l7f-snapshot-integrity-${{ github.run_id }}
          path: _s1_locked/L7f.log
          if-no-files-found: error

      - name: L8 NO-PLACEBO identical locked source
        working-directory: _s1_locked
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]|:[[:space:]]*True([[:space:]]|$)' Core Vendor --include='*.lean'; then
            exit 1
          fi
          python3 scripts/check_assumption_laundering.py

      - name: Generate S1 certificate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/generate_s1_certificate.py | tee /tmp/s1-certificate-generation.log
          test -s audit/CERTIFICATE_S1.json
          jq -e '.mathematical_promotion == false' audit/CERTIFICATE_S1.json
          jq -e '.endpoint.emit_closed_closed_closed == false' audit/CERTIFICATE_S1.json
          jq -e '.locked_successor.sha == "cf4e2553ff2234a80dc7f88b7d433a9b1eafc4c0"' audit/CERTIFICATE_S1.json
          sha256sum audit/CERTIFICATE_S1.json | tee audit/CERTIFICATE_S1.sha256

      - name: Upload S1 certificate manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1-certificate-${{ github.run_id }}
          path: |
            audit/CERTIFICATE_S1.json
            audit/CERTIFICATE_S1.sha256
            /tmp/s1-certificate-generation.log
          if-no-files-found: error

      - name: Upload S1 certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1-certification-evidence-${{ github.run_id }}
          path: |
            _frozen_s1/L7a.log
            _s1_locked/L7b-cache.log
            _s1_locked/L7b.log
            _s1_locked/L7c.log
            _s1_locked/L7d.log
            _s1_locked/L7e.log
            _s1_locked/L7f.log
          if-no-files-found: warn

      - name: Emission firewall
        run: |
          set -euo pipefail
          grep -q '"emit_closed_closed_closed": false' audit/8x5/NS_8x5_STATE.json
          echo 'LOCKS_8=TESTED'
          echo 'SIGMA_NS_0=(0,0,0,0,A_pending)'
          echo 'FECHADO_FECHADO_FECHADO=NO'
