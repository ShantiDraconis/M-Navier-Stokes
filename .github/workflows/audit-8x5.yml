name: audit-8x5-ns

on:
  push:
    branches: [audit/multistate-proof-refutation-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-8x5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit writer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen S1
        uses: actions/checkout@v4
        with:
          ref: c56d9632facf96e0a5d834b987b30df5fe2563a1
          path: _frozen_s1
          fetch-depth: 1

      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: L1 HEAD_EXATO
        run: |
          set -euo pipefail
          test ${#GITHUB_SHA} -eq 40
          git cat-file -e 6e17fc115336fef1c30797c2a50806c91567b920^{commit}
          echo "AUDIT_HEAD=$GITHUB_SHA"
          echo "SOURCE_HEAD=6e17fc115336fef1c30797c2a50806c91567b920"

      - name: L2 FROZEN_S1
        run: |
          set -euo pipefail
          test "$(git -C _frozen_s1 rev-parse HEAD)" = "c56d9632facf96e0a5d834b987b30df5fe2563a1"
          grep -q 'theorem I_core_closed' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L3 ENDPOINT_DEFINITION
        run: |
          grep -q 'def FinalTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean
          grep -q 'def ClosedClosedClosedTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L4 COMPRESSION
        run: |
          grep -q 'theorem final_of_middle_closed' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean
          grep -q 'def MiddleClosureTarget' _frozen_s1/Core/G1/ClosedClosedClosedTarget.lean

      - name: L5 8x5 semantic audit compiles
        run: |
          lake update
          lake exe cache get || true
          lake env lean audit/Universal8x5.lean
          lake env lean audit/NS_8x5.lean
          grep -q '"HC": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"Q": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"S": 0' audit/8x5/NS_8x5_STATE.json
          grep -q '"K": 0' audit/8x5/NS_8x5_STATE.json

      - name: L6 RESIDUE_CLASSIFIER
        run: |
          grep -q 'HC: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          grep -q 'Q: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          grep -q 'K: BLOCKING' audit/8x5/NS_8x5_PROTOCOL.md
          echo 'RESIDUE_CLASSIFIER=GREEN'

      - name: L7 BUILD frozen S1
        working-directory: _frozen_s1
        run: |
          lake update
          lake exe cache get || true
          lake build IMath
          lake build G1
          lake env lean Core/G1/ClosedClosedClosedTarget.lean

      - name: L8 NO-PLACEBO frozen source
        working-directory: _frozen_s1
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]|:[[:space:]]*True([[:space:]]|$)' Core Vendor --include='*.lean'; then
            exit 1
          fi
          python3 scripts/check_assumption_laundering.py

      - name: Emission firewall
        run: |
          grep -q '"emit_closed_closed_closed": false' audit/8x5/NS_8x5_STATE.json
          echo 'LOCKS_8=TESTED'
          echo 'SIGMA_NS_0=(0,0,0,0,A_pending)'
          echo 'FECHADO_FECHADO_FECHADO=NO'
